<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="好きになった順にアーティストと曲を書き残す音楽ブログ。">
<title>音の履歴書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #F2F3F6;
    --paper: #FFFFFF;
    --ink: #1A1E2C;
    --ink-soft: #545A6E;
    --rule: #D9DCE5;
    --accent: #A8325E;
    --accent-soft: #F3E3EA;
    --serif: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #12141C;
      --paper: #1A1D28;
      --ink: #E8E9EF;
      --ink-soft: #A3A8B8;
      --rule: #2E3242;
      --accent: #E07AA0;
      --accent-soft: #3A2230;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #12141C;
    --paper: #1A1D28;
    --ink: #E8E9EF;
    --ink-soft: #A3A8B8;
    --rule: #2E3242;
    --accent: #E07AA0;
    --accent-soft: #3A2230;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.9;
    padding-inline: 16px;
    padding-block: 0 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header.site {
    padding-block: 48px 32px;
    border-bottom: 1px solid var(--rule);
    display: grid;
    gap: 8px;
  }
  .site-eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .site-title {
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(36px, 8vw, 56px);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }
  .site-lead { margin: 0; color: var(--ink-soft); max-width: 36em; }

  /* 履歴（目次） */
  .history { padding-block: 28px; display: grid; gap: 12px; }
  .history h2 {
    font-family: var(--mono); font-weight: 500; font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin: 0;
  }
  .history ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .history a {
    display: grid; grid-template-columns: 3.5em 1fr auto; gap: 12px; align-items: baseline;
    color: inherit; text-decoration: none; padding: 10px 0; border-bottom: 1px dashed var(--rule);
  }
  .history a:hover .h-artist, .history a:focus-visible .h-artist { color: var(--accent); }
  .history a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .h-no { font-family: var(--mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .h-artist { font-family: var(--serif); font-weight: 700; font-size: 18px; }
  .h-song { font-size: 14px; color: var(--ink-soft); }

  /* 記事 */
  article.post {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: clamp(24px, 5vw, 48px);
    margin-top: 8px;
  }
  .post-meta {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  }
  .post-no {
    background: var(--accent); color: var(--paper);
    padding: 2px 10px; border-radius: 2px; letter-spacing: 0.08em;
  }
  .post-artist {
    font-family: var(--serif); font-weight: 700; font-size: 18px;
    margin: 24px 0 0; color: var(--ink-soft); letter-spacing: 0.04em;
  }
  .post-title {
    font-family: var(--serif); font-weight: 900;
    font-size: clamp(40px, 10vw, 72px); line-height: 1.05;
    margin: 4px 0 24px; letter-spacing: 0.01em; text-wrap: balance;
  }
  .post p { margin: 0 0 1.4em; max-width: 34em; }
  .post h3 {
    font-family: var(--serif); font-weight: 700; font-size: 21px;
    margin: 40px 0 12px; display: flex; align-items: baseline; gap: 12px;
  }
  .post h3::before {
    content: ""; width: 18px; height: 2px; background: var(--accent); flex: none; transform: translateY(-6px);
  }

  /* クレジット（ライナーノーツ風） */
  .credits {
    margin: 28px 0 8px; padding: 16px 20px;
    background: var(--accent-soft); border-radius: 2px;
    display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px;
    font-size: 14px;
  }
  .credits dt { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 0.08em; padding-top: 2px; }
  .credits dd { margin: 0; }

  .members { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 8px 0 24px; }
  .member { border-top: 2px solid var(--ink); padding-top: 10px; }
  .member b { font-family: var(--serif); font-size: 18px; display: block; }
  .member span { font-size: 14px; color: var(--ink-soft); }

  .listen {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 10px 18px;
    border: 1px solid var(--ink); border-radius: 2px;
    color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500;
  }
  .listen:hover, .listen:focus-visible { background: var(--ink); color: var(--paper); outline: none; }

  footer { margin-top: 40px; font-size: 13px; color: var(--ink-soft); text-align: center; }

  @media (max-width: 480px) {
    .history a { grid-template-columns: 3em 1fr; }
    .h-song { grid-column: 2; }
    .credits { grid-template-columns: 1fr; gap: 2px; }
    .credits dd { margin-bottom: 8px; }
  }
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <div class="site-eyebrow">My Music Notes</div>
    <h1 class="site-title">音の履歴書</h1>
    <p class="site-lead">好きになった順に、アーティストと曲を書き残していくブログ。一曲ずつ、出会いと魅力をつづります。</p>
  </header>

  <nav class="history" aria-label="これまでの記事">
    <h2>好きになった順</h2>
    <ol id="history"></ol>
  </nav>

  <main id="posts"></main>

  <footer>音の履歴書 — 次の一曲はまだ書きかけ。</footer>
</div>

<script>
  // 記事データ：好きになった順に追加していく
  const POSTS = [
    {
      id: "no1",
      artist: "CHAGE&ASKA",
      song: "LOVE SONG",
      year: "1989",
      tag: "原点",
      body: `
        <p>僕が最初に好きになったアーティストは、CHAGE&ASKA。そして入口になった曲が「LOVE SONG」です。このブログの一番目に置くなら、この曲以外にはありません。</p>

        <h3>CHAGE&ASKAというふたり</h3>
        <p>1979年にデビューした、福岡出身のデュオ。ふたりとも曲を書き、ふたりとも歌う。だからこそ、ひとつの曲の中に違う声と違う色が重なり合うのが魅力です。</p>
        <div class="members">
          <div class="member"><b>ASKA</b><span>伸びやかで力強いボーカル。メロディメーカーとしても多くの代表曲を手がける。</span></div>
          <div class="member"><b>Chage</b><span>温かみのある声とハーモニー。ポップで遊び心のある曲も持ち味。</span></div>
        </div>

        <h3>「LOVE SONG」という曲</h3>
        <p>1989年に発表された、ASKAが書いたバラード。タイトルはまっすぐなのに、歌われているのは単純な甘さだけではなく、愛を伝えることの難しさや、それでも伝えたいという気持ち。だからこそ、聴くたびに胸に残ります。</p>
        <p>静かに始まって、サビで一気に広がっていく構成。ASKAの高音とChageのハーモニーが重なる瞬間は、何度聴いても鳥肌が立つポイントです。</p>

        <dl class="credits">
          <dt>ARTIST</dt><dd>CHAGE&ASKA</dd>
          <dt>TITLE</dt><dd>LOVE SONG</dd>
          <dt>RELEASE</dt><dd>1989年</dd>
          <dt>WORDS / MUSIC</dt><dd>飛鳥 涼（ASKA）</dd>
        </dl>

        <h3>ここから始まった</h3>
        <p>この曲をきっかけに、僕の「好きな音楽」の履歴書が始まりました。これから好きになったアーティストや曲を、ひとつずつここに書き足していきます。</p>

        <a class="listen" href="https://www.youtube.com/results?search_query=CHAGE%26ASKA+LOVE+SONG" target="_blank" rel="noopener">▶ YouTubeで「LOVE SONG」を探す</a>
      `
    }
  ];

  const history = document.getElementById("history");
  const posts = document.getElementById("posts");

  POSTS.forEach((p, i) => {
    const no = "No." + String(i + 1).padStart(2, "0");

    const li = document.createElement("li");
    li.innerHTML = `<a href="#${p.id}"><span class="h-no">${no}</span><span class="h-artist">${p.artist}</span><span class="h-song">「${p.song}」</span></a>`;
    history.appendChild(li);

    const art = document.createElement("article");
    art.className = "post";
    art.id = p.id;
    art.innerHTML = `
      <div class="post-meta"><span class="post-no">${no}</span><span>${p.year}</span><span>#${p.tag}</span></div>
      <p class="post-artist">${p.artist}</p>
      <h2 class="post-title">${p.song}</h2>
      ${p.body}`;
    posts.appendChild(art);
  });
</script>
</body>
</html>
