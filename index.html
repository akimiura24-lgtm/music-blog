<style>
  :root {
    --ground: #F2F3F6;
    --paper: #FFFFFF;
    --ink: #1A1E2C;
    --ink-soft: #545A6E;
    --rule: #D9DCE5;
    --accent: #A8325E;
    --accent-soft: #F3E3EA;
    --serif: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;

    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #12141C;
      --paper: #1A1D28;
      --ink: #E8E9EF;
      --ink-soft: #A3A8B8;
      --rule: #2E3242;
      --accent: #E07AA0;
      --accent-soft: #3A2230;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #12141C;
    --paper: #1A1D28;
    --ink: #E8E9EF;
    --ink-soft: #A3A8B8;
    --rule: #2E3242;
    --accent: #E07AA0;
    --accent-soft: #3A2230;
  }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.9;
    padding-inline: 16px;
    padding-block: 0 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header.site {
    padding-block: 48px 32px;
    border-bottom: 1px solid var(--rule);
    display: grid;
    gap: 8px;
  }
  .site-eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .site-title {
    font-family: var(--serif);
    font-weight: 900;
    font-size: clamp(36px, 8vw, 56px);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }
  .site-lead { margin: 0; color: var(--ink-soft); max-width: 36em; }

  /* 履歴（目次） */
  .history { padding-block: 28px; display: grid; gap: 12px; }
  .history h2 {
    font-family: var(--mono); font-weight: 500; font-size: 12px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); margin: 0;
  }
  .history ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .history a {
    display: grid; grid-template-columns: 3.5em 1fr auto; gap: 12px; align-items: baseline;
    color: inherit; text-decoration: none; padding: 10px 0; border-bottom: 1px dashed var(--rule);
  }
  .history a:hover .h-artist, .history a:focus-visible .h-artist { color: var(--accent); }
  .history a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .h-no { font-family: var(--mono); font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .h-artist { font-family: var(--serif); font-weight: 700; font-size: 18px; }
  .h-song { font-size: 14px; color: var(--ink-soft); }

  /* 記事 */
  article.post {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: clamp(24px, 5vw, 48px);
    margin-top: 8px;
  }
  .post-meta {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  }
  .post-no {
    background: var(--accent); color: var(--paper);
    padding: 2px 10px; border-radius: 2px; letter-spacing: 0.08em;
  }
  .post-artist {
    font-family: var(--serif); font-weight: 700; font-size: 18px;
    margin: 24px 0 0; color: var(--ink-soft); letter-spacing: 0.04em;
  }
  .post-title {
    font-family: var(--serif); font-weight: 900;
    font-size: clamp(40px, 10vw, 72px); line-height: 1.05;
    margin: 4px 0 24px; letter-spacing: 0.01em; text-wrap: balance;
  }
  .post p { margin: 0 0 1.4em; max-width: 34em; }
  .credits a { color: var(--accent); }
  article.post + article.post { margin-top: 32px; }
  .post h3 {
    font-family: var(--serif); font-weight: 700; font-size: 21px;
    margin: 40px 0 12px; display: flex; align-items: baseline; gap: 12px;
  }
  .post h3::before {
    content: ""; width: 18px; height: 2px; background: var(--accent); flex: none; transform: translateY(-6px);
  }

  /* クレジット（ライナーノーツ風） */
  .credits {
    margin: 28px 0 8px; padding: 16px 20px;
    background: var(--accent-soft); border-radius: 2px;
    display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px;
    font-size: 14px;
  }
  .credits dt { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 0.08em; padding-top: 2px; }
  .credits dd { margin: 0; }

  .members { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 8px 0 24px; }
  .member { border-top: 2px solid var(--ink); padding-top: 10px; }
  .member b { font-family: var(--serif); font-size: 18px; display: block; }
  .member span { font-size: 14px; color: var(--ink-soft); }

  .listen {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 8px; padding: 10px 18px;
    border: 1px solid var(--ink); border-radius: 2px;
    color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500;
  }
  .listen:hover, .listen:focus-visible { background: var(--ink); color: var(--paper); outline: none; }

  footer { margin-top: 40px; font-size: 13px; color: var(--ink-soft); text-align: center; }

  @media (max-width: 480px) {
    .history a { grid-template-columns: 3em 1fr; }
    .h-song { grid-column: 2; }
    .credits { grid-template-columns: 1fr; gap: 2px; }
    .credits dd { margin-bottom: 8px; }
  }
</style>

          <dt>FAVORITE</dt><dd>心のボール（福岡市 市制100周年イメージソング）</dd>
          <dt>BEFORE</dt><dd><a href="#no5">万里の河（No.05）</a></dd>

      `
    }
  ];

  const history = document.getElementById("history");
  const posts = document.getElementById("posts");

  POSTS.forEach((p, i) => {
    const no = "No." + String(i + 1).padStart(2, "0");

    const li = document.createElement("li");
    li.innerHTML = `<a href="#${p.id}"><span class="h-no">${no}</span><span class="h-artist">${p.artist}</span><span class="h-song">${p.kind ? p.kind + "『" + p.song + "』" : "「" + p.song + "」"}</span></a>`;
    history.appendChild(li);

    const art = document.createElement("article");
    art.className = "post";
    art.id = p.id;
    art.innerHTML = `
      <div class="post-meta"><span class="post-no">${no}</span><span>${p.year}</span>${p.kind ? "<span>" + p.kind + "</span>" : ""}<span>#${p.tag}</span></div>
      <p class="post-artist">${p.artist}</p>
      <h2 class="post-title">${p.song}</h2>
      ${p.body}`;
    posts.appendChild(art);
  });
</script>
